[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cerex-pc-agentic-core"
version = "0.1.0"
description = "Read-only PC diagnostics, resource-aware CLI agents, persistent inter-agent mailbox, and opt-in LLM gateway."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
monitor = ["psutil>=5.9,<9"]
[project.scripts]
cerex-core = "cerex_core.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["cerex_core*"]
