[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cerex-pc-agentic-core"
version = "0.4.1"
description = "Local PC agent engine for CereX: diagnostics, resource-aware sandboxed agents, inter-agent bus. Contains no language model; commanded by the user's own LLM via the CereX connector."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
monitor = ["psutil>=5.9,<9"]
[project.scripts]
cerex-core = "cerex_core.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["cerex_core*"]
